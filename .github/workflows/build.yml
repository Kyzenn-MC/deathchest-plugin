name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Giải nén source
        run: unzip -q DeathChest-source.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Build
        run: gradle build
        working-directory: DeathChest

      - uses: actions/upload-artifact@v4
        with:
          name: DeathChest
          path: DeathChest/build/libs/*.jar
